server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API traffic to FastAPI. No trailing slash on proxy_pass, so the
    # /api prefix is preserved and the backend sees /api/login, not /login.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses BrowserRouter, so /dashboard and /profile are client-side
    # routes with no file on disk. Serve index.html for anything unmatched or a
    # hard refresh on those paths returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
