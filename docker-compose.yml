services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      # Replaces nginx's default server block: proxies /api to the backend so
      # the frontend's relative fetch() calls resolve to FastAPI.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      # Only takes effect if watchfiles is installed (uvicorn[standard]); the
      # current requirements.txt has plain uvicorn, so the reloader falls back
      # to StatReload, which already polls and works over Windows bind mounts.
      # Kept so reloading keeps working if watchfiles is added later.
      - WATCHFILES_FORCE_POLLING=true
      # Set to false to skip the Ollama warm-up on startup, which --reload
      # otherwise re-runs on every code change.
      - AI_WARMUP=true
      # Signs the session cookie. Falls back to a known dev value so the
      # stack runs out of the box; override in .env before deploying.
      - SESSION_SECRET=${SESSION_SECRET:-dev-only-insecure-session-secret}
      # Graph store for the per-note concept graph. Defaulted so the stack comes
      # up even if an existing local .env predates these keys.
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme_graph}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to localhost so the database is not reachable from other machines
      # on the network, regardless of firewall configuration.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # Localhost only: the pgAdmin login is a well-known default.
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme_graph}
      # Explicit limits: CI runners have ~7GB total and already run Postgres and
      # Ollama. Neo4j otherwise sizes its heap off total host RAM and will
      # happily claim more than is left.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    ports:
      # Localhost only, matching the db and pgadmin convention.
      - "127.0.0.1:7474:7474"   # HTTP / Neo4j Browser
      - "127.0.0.1:7687:7687"   # Bolt
    volumes:
      # NOT a cache. Node positions and colours live here and cannot be
      # regenerated, so `docker compose down -v` destroys real user work.
      - neo4j_data:/data
    healthcheck:
      # cypher-shell ships in the image and proves Bolt itself is serving, which
      # is the port the backend uses. Probing 7474 with wget/curl is unreliable:
      # neither binary is guaranteed present, and a check that can never pass
      # leaves the backend blocked forever on service_healthy.
      # $$ escapes compose interpolation so the container expands the variable.
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-changeme_graph} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      # First boot initialises the store and is much slower than a restart.
      # Without this the retries are spent before Neo4j is ever ready.
      start_period: 40s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # GPU CONFIG MOVED TO docker-compose.override.yml

volumes:
  postgres_data:
  neo4j_data:
  ollama:
